<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Hotspot Finder</title>
<!-- The integrity value is a fingerprint: the browser refuses the file if a
     single byte differs from the published Leaflet 1.9.4. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  body { margin: 0; padding: 16px 20px; background: #14181d; color: #e8e8e8;
         font-family: "Segoe UI", Arial, sans-serif; }
  h1 { margin: 0 0 12px; font-size: 22px; }
  h2 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  main { display: flex; gap: 20px; }
  /* Targets the heat image by id: Leaflet draws its dots on a canvas of its own,
     and a page-wide canvas background would paint over the map underneath. */
  #heat { display: block; background: #000; }
  /* flex: 1 lets the map take whatever width the heat image leaves, which keeps
     it on the right on a small laptop screen. */
  #map-section { flex: 1; min-width: 300px; }
  #map { height: 384px; background: #222; }
  .status { margin: 8px 0 0; font-size: 14px; min-height: 20px; }
  .warning { color: #ffb74d; }
</style>
</head>
<body>
<h1>Night Hotspot Finder</h1>
<main>
  <section>
    <h2>Heat image</h2>
    <canvas id="heat" width="512" height="384"></canvas>
    <p class="status" id="heat-status">Waiting for the first frame...</p>
  </section>
  <section id="map-section">
    <h2>Satellite hotspots, last 24 hours</h2>
    <div id="map"></div>
    <p class="status" id="satellite-status">Loading satellite hotspots...</p>
  </section>
</main>

<script>
  const SCALE = 16;            // each sensor pixel is drawn as a 16x16 square
  const COLDEST_C = 10;        // bottom of the colour scale
  const HOTTEST_C = 80;        // top of the colour scale
  const REFRESH_MS = 500;      // matches the camera's 2 frames a second

  const canvas = document.getElementById("heat");
  const paint = canvas.getContext("2d");
  const heatStatus = document.getElementById("heat-status");
  const satelliteStatus = document.getElementById("satellite-status");

  // Turn a temperature into a colour: blue when cold, through green and yellow
  // to red when hot.
  function colourFor(temperature) {
    const share = Math.min(Math.max((temperature - COLDEST_C) / (HOTTEST_C - COLDEST_C), 0), 1);
    return `hsl(${240 - share * 240}, 100%, 50%)`;
  }

  function drawFrame(state) {
    for (let y = 0; y < state.height; y++) {
      for (let x = 0; x < state.width; x++) {
        paint.fillStyle = colourFor(state.frame[y * state.width + x]);
        paint.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
      }
    }
  }

  // Draw a line only along the sides of a pixel with no hot neighbour, which
  // leaves one clean outline around the whole hotspot.
  function outlineHotspot(hotspot) {
    const inside = new Set(hotspot.cells.map(([x, y]) => `${x},${y}`));
    paint.strokeStyle = "#ffffff";
    paint.lineWidth = 2;
    paint.beginPath();
    for (const [x, y] of hotspot.cells) {
      const left = x * SCALE, right = left + SCALE, top = y * SCALE, bottom = top + SCALE;
      if (!inside.has(`${x},${y - 1}`)) { paint.moveTo(left, top); paint.lineTo(right, top); }
      if (!inside.has(`${x},${y + 1}`)) { paint.moveTo(left, bottom); paint.lineTo(right, bottom); }
      if (!inside.has(`${x - 1},${y}`)) { paint.moveTo(left, top); paint.lineTo(left, bottom); }
      if (!inside.has(`${x + 1},${y}`)) { paint.moveTo(right, top); paint.lineTo(right, bottom); }
    }
    paint.stroke();
  }

  async function refreshHeatImage() {
    try {
      const reply = await fetch("/api/state");
      const state = await reply.json();
      drawFrame(state);
      state.hotspots.forEach(outlineHotspot);
      const hottest = state.hotspots.length
        ? Math.max(...state.hotspots.map(spot => spot.max_c)).toFixed(1) + " °C"
        : "none";
      heatStatus.textContent = `Hotspots: ${state.hotspots.length}. Hottest: ${hottest}. Source: ${state.mode}.`;
      heatStatus.className = "status";
    } catch (problem) {
      heatStatus.textContent = "Lost contact with the server. Trying again...";
      heatStatus.className = "status warning";
    }
    // Wait for each reply before asking again, so a slow server can't pile up requests.
    setTimeout(refreshHeatImage, REFRESH_MS);
  }

  async function startMap() {
    // Leaflet comes from the internet, so with no connection the map is skipped
    // and the heat image carries on.
    if (typeof L === "undefined") {
      satelliteStatus.textContent = "Map library did not load. Check the internet connection.";
      satelliteStatus.className = "status warning";
      return;
    }

    const settings = await (await fetch("/api/config")).json();
    // Drawing thousands of dots on one canvas is much faster than one element per dot.
    const map = L.map("map", { preferCanvas: true })
      .setView([settings.camera_lat, settings.camera_lon], 5);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const satellite = await (await fetch("/api/satellite")).json();
    for (const point of satellite.points) {
      L.circleMarker([point.lat, point.lon], {
        radius: 3, color: "#ff8c00", fillColor: "#ff8c00", fillOpacity: 0.9, weight: 1,
      }).addTo(map);
    }
    satelliteStatus.textContent = satellite.message || `${satellite.points.length} satellite hotspots loaded.`;
    satelliteStatus.className = satellite.message ? "status warning" : "status";
  }

  refreshHeatImage();
  startMap().catch(() => {
    satelliteStatus.textContent = "Could not load satellite hotspots. The heat image is unaffected.";
    satelliteStatus.className = "status warning";
  });
</script>
</body>
</html>
